<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Library Test Page</title>
    <style>
        body { font-family: Arial; margin: 20px; }
        table { border-collapse: collapse; margin-top: 10px; }
        td, th { border: 1px solid black; padding: 5px 10px; }
        input { margin: 3px; }
        .error { color: red; font-weight: bold; }
        .ok { color: green; font-weight: bold; }
        .section { margin-top: 20px; border-top: 1px solid #ccc; padding-top: 10px; }
    </style>
</head>
<body>
    <h1>Library Test Page</h1>

    <div class="section">
        <h2>Books</h2>
        <button onclick="loadBooks()">Refresh</button>
        <label><input type="checkbox" id="onlyAvailable" onchange="loadBooks()"> only available</label>
        <label><input type="checkbox" id="onlyOverdue" onchange="loadBooks()"> only overdue</label>
        <table>
            <thead>
                <tr><th>Title</th><th>Author</th><th>ISBN</th><th>Status</th><th>Borrowed By</th><th>Due Date</th></tr>
            </thead>
            <tbody id="bookRows"></tbody>
        </table>
    </div>

    <div class="section">
        <h2>Search</h2>
        Query: <input id="searchQuery" size="20">
        <select id="searchBy">
            <option value="title">title</option>
            <option value="author">author</option>
        </select>
        <button onclick="searchBooks()">Search</button>
        <table>
            <thead>
                <tr><th>Title</th><th>Author</th><th>ISBN</th><th>Status</th></tr>
            </thead>
            <tbody id="searchRows"></tbody>
        </table>
    </div>

    <div class="section">
        <h2>Add book</h2>
        Title: <input id="newTitle" size="25">
        Author: <input id="newAuthor" size="20">
        ISBN: <input id="newIsbn" size="18">
        <button onclick="addBook()">Add</button>
    </div>

    <div class="section">
        <h2>Borrow / Return</h2>
        ISBN: <input id="actionIsbn" size="18">
        Patron ID: <input id="patronId" size="8" value="P001">
        <button onclick="borrowBook()">Borrow</button>
        <button onclick="returnBook()">Return</button>
    </div>

    <div class="section">
        <h2>Patrons</h2>
        <button onclick="loadPatrons()">Refresh</button>
        <table>
            <thead>
                <tr><th>ID</th><th>Name</th></tr>
            </thead>
            <tbody id="patronRows"></tbody>
        </table>
        <br>
        New Patron ID: <input id="newPatronId" size="8">
        Name: <input id="newPatronName" size="20">
        <button onclick="addPatron()">Add Patron</button>
    </div>

    <p id="message"></p>

    <script>
        function showMessage(text, isError) {
            var el = document.getElementById("message");
            el.innerText = text;
            el.className = isError ? "error" : "ok";
        }

        function loadBooks() {
            var url = "/api/books";
            if (document.getElementById("onlyOverdue").checked) {
                url = "/api/books/overdue";
            } else if (document.getElementById("onlyAvailable").checked) {
                url = "/api/books/available";
            }
            fetch(url).then(function (res) {
                return res.json();
            }).then(function (books) {
                var html = "";
                for (var i = 0; i < books.length; i++) {
                    var status = "Available";
                    if (books[i].borrowed) {
                        status = "Borrowed";
                    }
                    html += "<tr><td>" + books[i].title + "</td><td>" + books[i].author + "</td><td>"
                        + books[i].isbn + "</td><td>" + status + "</td><td>"
                        + (books[i].borrowedBy || "") + "</td><td>"
                        + (books[i].dueDate || "") + "</td></tr>";
                }
                document.getElementById("bookRows").innerHTML = html;
            });
        }

        function searchBooks() {
            var q = document.getElementById("searchQuery").value;
            var by = document.getElementById("searchBy").value;
            fetch("/api/books/search?q=" + encodeURIComponent(q) + "&by=" + by).then(function (res) {
                return res.json();
            }).then(function (books) {
                var html = "";
                for (var i = 0; i < books.length; i++) {
                    var status = books[i].borrowed ? "Borrowed" : "Available";
                    html += "<tr><td>" + books[i].title + "</td><td>" + books[i].author + "</td><td>"
                        + books[i].isbn + "</td><td>" + status + "</td></tr>";
                }
                document.getElementById("searchRows").innerHTML = html;
            });
        }

        function addBook() {
            var data = {
                title: document.getElementById("newTitle").value,
                author: document.getElementById("newAuthor").value,
                isbn: document.getElementById("newIsbn").value
            };
            fetch("/api/books", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(data)
            }).then(function (res) {
                return res.json();
            }).then(function (answer) {
                showMessage(JSON.stringify(answer), answer.status === "error");
                loadBooks();
            });
        }

        function borrowBook() {
            var isbn = document.getElementById("actionIsbn").value;
            var patronId = document.getElementById("patronId").value;
            fetch("/api/books/" + isbn + "/borrow?patronId=" + encodeURIComponent(patronId), { method: "POST" }).then(function (res) {
                return res.json();
            }).then(function (answer) {
                showMessage(JSON.stringify(answer), answer.status === "error");
                loadBooks();
            });
        }

        function returnBook() {
            var isbn = document.getElementById("actionIsbn").value;
            fetch("/api/books/" + isbn + "/return", { method: "POST" }).then(function (res) {
                return res.json();
            }).then(function (answer) {
                showMessage(JSON.stringify(answer), answer.status === "error");
                loadBooks();
            });
        }

        function loadPatrons() {
            fetch("/api/patrons").then(function (res) {
                return res.json();
            }).then(function (patrons) {
                var html = "";
                for (var i = 0; i < patrons.length; i++) {
                    html += "<tr><td>" + patrons[i].id + "</td><td>" + patrons[i].name + "</td></tr>";
                }
                document.getElementById("patronRows").innerHTML = html;
            });
        }

        function addPatron() {
            var data = {
                id: document.getElementById("newPatronId").value,
                name: document.getElementById("newPatronName").value
            };
            fetch("/api/patrons", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(data)
            }).then(function (res) {
                return res.json();
            }).then(function (answer) {
                showMessage(JSON.stringify(answer), answer.status === "error");
                loadPatrons();
            });
        }

        loadBooks();
        loadPatrons();
    </script>
</body>
</html>
